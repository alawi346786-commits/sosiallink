    <!-- LOADING SCREEN GLOBAL -->
    <div id="global-loader" class="glass active">
        <div class="spinner"></div>
    </div>

    <!-- VIEW: LANDING PAGE -->
    <div id="view-landing" class="view">
        <nav class="navbar glass">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--primary)"><circle cx="12" cy="12" r="10"/></svg>
                <span>Sosiallink</span>
            </div>
            <button class="btn ripple" id="btn-login-nav">Masuk</button>
        </nav>
        <main class="hero">
            <div class="hero-content">
                <h1>Satu Tautan,<br>Tak Terbatas.</h1>
                <p>Bagikan semua karya, tautan sosial, dan portofolio Anda di satu tempat yang indah dengan identitas yang kuat.</p>
                <button class="btn btn-large ripple" id="btn-login-hero">
                    <svg width="20" height="20"><use href="#icon-google"></use></svg> Masuk dengan Google
                </button>
            </div>
        </main>
    </div>

    <!-- VIEW: DASHBOARD (ADMIN) -->
    <div id="view-dashboard" class="view">
        <nav class="navbar glass">
            <div class="logo"><span>Sosiallink</span></div>
            <button class="btn btn-outline" id="btn-logout">Keluar</button>
        </nav>
        <div class="dashboard-layout">
            <div class="dashboard-editor">
                <div class="profile-card glass">
                    <div class="profile-header">
                        <!-- Wrapper Foto Profil untuk Ganti Foto -->
                        <div class="avatar-wrapper" id="btn-change-photo" title="Ganti Foto Profil">
                            <img id="dash-photo" src="" alt="Profile" class="avatar">
                            <div class="avatar-overlay">
                                <svg width="24" height="24" stroke="white"><use href="#icon-camera"></use></svg>
                            </div>
                            <input type="file" id="input-avatar" accept="image/png, image/jpeg, image/webp" style="display:none;">
                        </div>

                        <div class="profile-info">
                            <!-- Input Baru untuk Mengubah Nama (Display Name) -->
                            <input type="text" id="input-display-name" class="input-display-name" placeholder="Nama Anda (Misal: Alwi)">
                            <div class="input-group">
                                <span>sosiallink/</span>
                                <input type="text" id="input-username" placeholder="username">
                            </div>
                        </div>
                    </div>
                    <textarea id="input-bio" placeholder="Tulis bio singkat tentang Anda..." maxlength="150"></textarea>
                    <div class="profile-actions">
                        <button class="btn ripple" id="btn-save-profile">Simpan Profil</button>
                        <button class="btn btn-outline" id="btn-copy-link">
                            <svg width="18" height="18"><use href="#icon-copy"></use></svg> Salin Link
                        </button>
                    </div>
                </div>

                <div class="links-manager">
                    <button class="btn btn-large btn-block ripple" id="btn-add-link">
                        <svg width="20" height="20"><use href="#icon-plus"></use></svg> Tambah Link Baru
                    </button>
                    <div id="links-container" class="sortable-list">
                        <!-- Links akan dirender di sini via JS -->
                    </div>
                </div>
            </div>

            <div class="dashboard-preview">
                <div class="phone-mockup">
                    <iframe id="preview-frame" src="" frameborder="0"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- VIEW: PUBLIC PROFILE -->
    <div id="view-profile" class="view">
        <div class="public-container">
            <div id="public-content">
                <!-- Data publik akan dirender di sini via JS -->
                <div class="skeleton-profile">
                    <div class="skel-avatar skeleton"></div>
                    <div class="skel-text skeleton"></div>
                    <div class="skel-text skeleton" style="width: 50%;"></div>
                    <div class="skel-btn skeleton"></div>
                    <div class="skel-btn skeleton"></div>
                </div>
            </div>
            <div class="watermark">Powered by <strong>Sosiallink</strong></div>
        </div>
    </div>

    <!-- VIEW: 404 NOT FOUND -->
    <div id="view-404" class="view">
        <div class="not-found glass">
            <h2>404</h2>
            <p>Halaman yang Anda cari tidak ditemukan.</p>
            <button class="btn ripple" onclick="history.pushState(null, '', '/'); dispatchEvent(new Event('popstate'));">Kembali ke Beranda</button>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container"></div>

    <script type="module" src="app.js"></script>
</body>
